plugins {
    id 'net.neoforged.gradle' version '[6.0,6.2)'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}

version = '1.0.0'
group = 'com.strawbed'
archivesBaseName = 'strawbed'

base {
    archivesName = 'strawbed'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

eclipse.downloads.sources = true
eclipse.downloads.javadoc = true

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

repositories {
    mavenLocal()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'NeoForged Snapshots'
        url = 'https://maven.neoforged.net/snapshots'
    }
    maven {
        name = 'Minecraft Forge Maven'
        url = 'https://maven.minecraftforge.net'
    }
    maven {
        name = 'Sponge / Mixin'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    mavenCentral()
}

dependencies {
    implementation 'net.neoforged:neoforge:26.1.2'
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'universal'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url = "file:///${project.projectDir}/repo"
        }
    }
}
